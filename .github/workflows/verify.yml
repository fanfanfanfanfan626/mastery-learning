name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      MASTERY_HOME: ${{ github.workspace }}/work/ci-mastery-home
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit curriculum
        run: python plugins/mastery-learning/skills/mastery-coach/scripts/curriculum_audit.py
      - name: Audit conversation eval suite
        run: python quality/eval_audit.py suite quality/evals/plugin-evals.json
      - name: Compile Python sources
        run: python -m compileall -q plugins quality
      - name: Run system tests
        run: python -m unittest discover -s quality -p "test_*.py" -v
      - name: Build release candidate
        run: >-
          python quality/build_release.py
          --output work/mastery-learning-0.4.2.zip
          --checksum-output work/mastery-learning-0.4.2.zip.sha256
      - name: Audit candidate against checked-out Git tree
        run: python quality/release_audit.py archive work/mastery-learning-0.4.2.zip --git-ref HEAD --expected-version 0.4.2
      - name: Upload platform candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            work/mastery-learning-0.4.2.zip
            work/mastery-learning-0.4.2.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release-reproducibility:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: work/release-candidates
      - name: Compare Windows and Linux release bytes
        run: >-
          python quality/release_audit.py compare
          work/release-candidates/release-ubuntu-latest/mastery-learning-0.4.2.zip
          work/release-candidates/release-windows-latest/mastery-learning-0.4.2.zip
      - name: Compare Windows and Linux checksum files
        run: >-
          python quality/release_audit.py compare
          work/release-candidates/release-ubuntu-latest/mastery-learning-0.4.2.zip.sha256
          work/release-candidates/release-windows-latest/mastery-learning-0.4.2.zip.sha256
      - name: Match a version tag to the archived plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python quality/release_audit.py archive \
            work/release-candidates/release-ubuntu-latest/mastery-learning-0.4.2.zip \
            --git-ref HEAD \
            --expected-version "$version"
      - name: Require release-quality conversation evidence for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          python quality/eval_audit.py release-evidence
          quality/evals/plugin-evals.json
          quality/evals/results/0.4.2
      - name: Attest tagged release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: work/release-candidates/release-ubuntu-latest/mastery-learning-0.4.2.zip
